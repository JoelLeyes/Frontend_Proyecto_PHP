# ============================================================
# Docker Compose — Frontend Servicios Profesionales
#
# Servicios:
#   - app: Laravel + Vue 3 + Vite en :5173 (dev) / :3000 (prod)
#
# Uso:
#   docker compose up --build
# ============================================================

services:
  app:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      APP_ENV: local
      VITE_API_URL: http://localhost:8000
